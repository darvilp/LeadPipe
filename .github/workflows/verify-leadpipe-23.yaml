name: Verify signed LeadPipe .23 on Android

on:
  push:
    branches:
      - test/leadpipe-23-acceptance

permissions:
  actions: read
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the acceptance script
        run: |
          git init .
          git fetch --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Download the matching signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14834198765/zip" > "$RUNNER_TEMP/leadpipe.zip"
          cd "$RUNNER_TEMP"
          echo 'ef1028db70c97b9a6cb0152451ccfaed5552da72f75024b91539093cb580f153  leadpipe.zip' | sha256sum -c
          unzip -q leadpipe.zip -d verified-leadpipe-23
      - name: Install the disposable Android image
        run: sdkmanager 'platform-tools' 'emulator' 'system-images;android-35;default;x86_64' 'build-tools;37.0.0'
      - name: Check the exact signed candidate on Android
        shell: bash
        run: bash tools/verify-leadpipe-23-device.sh "$RUNNER_TEMP/verified-leadpipe-23"
