name: Build and release LeadPipe

on:
  push:
    branches:
      - unofficial/all-features
      - integration/pipepipe-5.6.0
      - candidate/leadpipe-5.6.0.25
      - candidate/leadpipe-5.6.0.27
      - candidate/leadpipe-5.6.0.28
      - candidate/leadpipe-5.6.0.29
      - candidate/leadpipe-5.6.0.30
      - candidate/leadpipe-5.6.0.31
      - candidate/leadpipe-5.6.0.32
      - candidate/leadpipe-5.6.0.33
      - candidate/leadpipe-5.6.0.34
      - candidate/leadpipe-5.6.0.35
      - candidate/leadpipe-5.6.0.36
      - feat/sponsorblock-server-urls
    tags:
      - leadpipe/v*

permissions:
  contents: read

jobs:
  build:
    name: Build and verify LeadPipe APKs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: PipePipeClient

      - name: Test release entry point
        run: python3 PipePipeClient/tools/test_release.py

      - name: Verify the update endpoint for the repository rename
        if: github.ref == 'refs/heads/candidate/leadpipe-5.6.0.25'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint=$(grep -Eo 'https://api.github.com/repositories/[0-9]+/releases/latest' \
            PipePipeClient/app/src/main/java/org/schabi/newpipe/LeadPipeRelease.kt)
          by_id=$(gh api "$endpoint" --jq '[.id, .tag_name] | @tsv')
          by_name=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '[.id, .tag_name] | @tsv')
          [[ "$by_id" == "$by_name" && -n "$by_id" ]]
          echo "Both updater paths return the same release: $by_id"

      - name: Read pinned extractor source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("PipePipeClient/release/source-manifest.json").read_text())
          repository = manifest["extractor_repository"].removeprefix("https://github.com/").removesuffix(".git")
          print(f"extractor_repository={repository}")
          print(f"extractor_commit={manifest['extractor_commit']}")
          PY

      - name: Checkout extractor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.source.outputs.extractor_repository }}
          ref: ${{ steps.source.outputs.extractor_commit }}
          path: PipePipeExtractor

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PIPEPIPE_ALL_FEATURES_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/pipepipe-all-features-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "PIPEPIPE_KEY_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build and verify release assets
        shell: bash
        env:
          KEY_PATH: ${{ env.PIPEPIPE_KEY_PATH }}
          KEY_STORE_PASSWORD: ${{ secrets.PIPEPIPE_ALL_FEATURES_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIPEPIPE_ALL_FEATURES_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PIPEPIPE_ALL_FEATURES_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          parent="$RUNNER_TEMP/pipepipe-all-features-assets"
          python3 PipePipeClient/tools/release.py --output "$parent"
          mapfile -t candidates < <(find "$parent" -mindepth 1 -maxdepth 1 -type d -print)
          ((${#candidates[@]} == 1)) || { echo "Expected exactly one candidate directory" >&2; exit 1; }
          echo "PIPEPIPE_ASSET_DIR=${candidates[0]}" >> "$GITHUB_ENV"

      - name: Upload verified test assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: leadpipe-release-assets
          path: ${{ env.PIPEPIPE_ASSET_DIR }}
          if-no-files-found: error

      - name: Upload signed ARM64 APK for device testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ env.PIPEPIPE_ASSET_DIR }}/*-arm64-v8a.apk
          archive: false
          if-no-files-found: error

  release:
    name: Create draft LeadPipe release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout tagged client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: PipePipeClient

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install Android SDK build tools
        shell: bash
        run: sdkmanager "build-tools;37.0.0"

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          read -r version expected < <(python3 - <<'PY'
          import json

          manifest = json.load(open('PipePipeClient/release/source-manifest.json'))
          version = manifest['version_name']
          print(version, manifest.get('legacy_release_tag', f'leadpipe/v{version}'))
          PY
          )
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match release version $expected" >&2
            exit 1
          }
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: leadpipe-release-assets
          path: ${{ runner.temp }}/pipepipe-all-features-assets

      - name: Reverify downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/pipepipe-all-features-assets"
          (cd "$assets" && sha256sum -c SHA256SUMS)
          python3 - "$assets/source-manifest.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          downloaded = json.loads(Path(sys.argv[1]).read_text())
          tracked = json.loads(Path('PipePipeClient/release/source-manifest.json').read_text())
          client_commit = downloaded.pop('client_commit', None)
          if client_commit != os.environ['GITHUB_SHA']:
              raise SystemExit('Downloaded manifest client commit does not match the tag')
          if downloaded != tracked:
              raise SystemExit('Downloaded source manifest does not match the tagged policy')
          PY
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            mapfile -t apks < <(find "$assets" -maxdepth 1 -type f -name "*-$abi.apk" -print)
            ((${#apks[@]} == 1)) || { echo "Expected exactly one $abi APK" >&2; exit 1; }
            python3 PipePipeClient/tools/verify-unofficial-apk.py "${apks[0]}" \
              --sdk "$ANDROID_HOME" --abi "$abi"
          done

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          prerelease: false
          name: LeadPipe ${{ steps.version.outputs.name }}
          body_path: PipePipeClient/release/RELEASE_NOTES.md
          files: |
            ${{ runner.temp }}/pipepipe-all-features-assets/*.apk
            ${{ runner.temp }}/pipepipe-all-features-assets/SHA256SUMS
            ${{ runner.temp }}/pipepipe-all-features-assets/RELEASE_NOTES.md
            ${{ runner.temp }}/pipepipe-all-features-assets/apk-manifest-*.json
            ${{ runner.temp }}/pipepipe-all-features-assets/source-manifest.json
